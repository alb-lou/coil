name: Build Coil (macOS)
on:
  push:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          echo "Files in repo:"; find . -maxdepth 4 -not -path './.git/*' | head -50
          CM=$(find . -maxdepth 5 -name CMakeLists.txt -not -path './build/*' | head -1)
          if [ -z "$CM" ]; then echo "ERROR: no CMakeLists.txt found"; exit 1; fi
          SRC=$(dirname "$CM")
          echo "Using source folder: $SRC"
          cmake -S "$SRC" -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Ad-hoc sign and package
        run: |
          mkdir -p dist
          for f in $(find build -maxdepth 5 \( -name "Coil.component" -o -name "Coil.vst3" -o -name "Coil.app" \)); do
            codesign --force --deep -s - "$f"
            cp -R "$f" dist/
          done
          ls dist
          cd dist && ditto -c -k --sequesterRsrc --keepParent . ../Coil-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Coil-macOS
          path: Coil-macOS.zip
